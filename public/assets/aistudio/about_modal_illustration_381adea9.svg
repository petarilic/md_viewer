    <text x="195" y="566" font-size="21" font-weight="700" fill="#24213a">About the application</text>
    <text x="195" y="595" font-size="17" fill="#77748b">Create, view, edit and export Markdown documents</text>
    <text x="195" y="619" font-size="17" fill="#77748b">in a clean and intuitive interface.</text>
    <circle cx="158" cy="675" r="19" fill="#f0edff"/><text x="158" y="682" text-anchor="middle" font-size="20" fill="#6d5bd0">◷</text>
    <text x="195" y="671" font-size="21" font-weight="700" fill="#24213a">Release information</text>
    <text x="195" y="700" font-size="17" fill="#77748b">Release date: 23 October 2026</text>
    <text x="195" y="724" font-size="17" fill="#77748b">Build: 120</text>
    <circle cx="158" cy="778" r="19" fill="#f0edff"/><text x="158" y="785" text-anchor="middle" font-size="20" fill="#6d5bd0">⌘</text>
    <text x="195" y="774" font-size="21" font-weight="700" fill="#24213a">Developer</text>
    <text x="195" y="803" font-size="17" fill="#77748b">Developer or company name</text>
