  <text x="450" y="374" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#24213a">Markdown Viewer</text>
  <text x="450" y="411" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" fill="#77748b">Version 1.2.0</text>
  <text x="450" y="453" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" fill="#66627d">A simple and powerful tool for viewing,</text>
  <text x="450" y="480" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" fill="#66627d">editing and exporting Markdown documents.</text>
  <line x1="130" y1="520" x2="770" y2="520" stroke="#eeeaf8" stroke-width="2"/>
  <g font-family="Inter,Arial,sans-serif">
