<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1120" viewBox="0 0 900 1120" role="img" aria-labelledby="title desc">
  <title id="title">About modal illustration — Markdown Viewer</title>
  <desc id="desc">Illustrative About modal showing application icon, name, version, description, release information, developer, privacy policy, terms, support, and copyright.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#29234a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="900" height="1120" fill="#f5f3ff"/>
  <rect x="90" y="45" width="720" height="1030" rx="28" fill="#ffffff" stroke="#e5e1f5" filter="url(#shadow)"/>
  <text x="450" y="108" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#24213a">About</text>
  <path d="M770 78 L792 100 M792 78 L770 100" stroke="#77748b" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="90" y1="140" x2="810" y2="140" stroke="#eeeaf8" stroke-width="2"/>
  <rect x="378" y="184" width="144" height="144" rx="28" fill="#ede9fe"/>
  <rect x="414" y="211" width="72" height="91" rx="8" fill="#6d5bd0"/>
